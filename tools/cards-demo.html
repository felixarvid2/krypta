<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kortdemo</title>
<link rel="stylesheet" href="../css/cards.css">
<style>
  @font-face { font-family: "PressStart2P"; src: url(../assets/font/PressStart2P.ttf); }
  html, body { margin: 0; min-height: 100%; background: #0b0806; color: #e8d9b0; font-family: "PressStart2P", monospace; }
  main { padding: 20px 16px; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 18px; color: #d8442a; margin: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button.d { font: inherit; font-size: 10px; padding: 12px 16px; background: #5a1a10; color: #ffe9a8; border: 3px solid #d8a24a; cursor: pointer; }
  button.d:hover { background: #7c2616; }
  #log { font-size: 8px; line-height: 2; color: #c9a87a; white-space: pre-wrap; min-height: 120px; border: 2px solid #3a2c1e; padding: 10px; }
  #state { font-size: 9px; color: #ffd24a; }
</style>
</head>
<body>
<main>
  <h1>KORTDEMO</h1>
  <div id="state"></div>
  <div class="row">
    <button class="d" id="b-draft">DRAFT (3 KORT)</button>
    <button class="d" id="b-draft5">DRAFT (5 KORT)</button>
    <button class="d" id="b-chest">KISTA (TOAST)</button>
    <button class="d" id="b-shop">BUTIK</button>
    <button class="d" id="b-souls">SJÄLSBUTIK</button>
    <button class="d" id="b-deck">KORTLEK</button>
    <button class="d" id="b-draftx">DRAFT MED SYNERGI, FÖRVISA OCH NYA KORT</button>
    <button class="d" id="b-codex">KORTARKIV</button>
    <button class="d" id="b-deck5">KORTLEK: STATISTIK OCH SMÄLT SAMMAN</button>
    <button class="d" id="b-draft5x">DRAFT: DU HAR + LEGENDARISK</button>
    <button class="d" id="b-alk">ALKEMISTEN (NYA VAROR)</button>
    <button class="d" id="b-draft6">DRAFT: FÖRE → EFTER</button>
    <button class="d" id="b-deck6">KORTLEK: FILTER, FÖRMÅGOR OCH VÄRDEN</button>
    <button class="d" id="b-refine">LÄGERELDEN: FÖRÄDLA</button>
    <button class="d" id="b-codex6">KORTARKIV: SAKNADE KORT</button>
    <button class="d" id="b-draft7">DRAFT: NYA KORT OCH GLANS</button>
    <button class="d" id="b-shop7">BUTIK: GLANS PÅ SÄLLSYNTA</button>
    <button class="d" id="b-deck7">KORTLEK: SÄLJ OCH SENAST VALDA</button>
    <button class="d" id="b-codex7">KORTARKIV: SÖK OCH SET</button>
    <button class="d" id="b-pact7">DRAFT: NYA PAKTER</button>
    <button class="d" id="b-talents8">NIVÅ UPP: TALANGVAL</button>
    <button class="d" id="b-pact8">DRAFT: HARPUN, BUMERANG OCH PRISMA</button>
    <button class="d" id="b-draft8">DRAFT: KRISTALL, HAV OCH AVGRUND</button>
    <button class="d" id="b-codex8">KORTARKIV: VERSION 8</button>
    <button class="d" id="b-pact9">DRAFT: SÅGBLAD, VINDBÖSSA OCH SPJUT</button>
    <button class="d" id="b-draft9">DRAFT: URVERK, STORM OCH HÖJD</button>
    <button class="d" id="b-codex9">KORTARKIV: VERSION 9</button>
    <button class="d" id="b-pact11">DRAFT: SPORKASTARE, SPEGELSKÖLD OCH PISKA</button>
    <button class="d" id="b-draft11">DRAFT: SVAMP, SPORER, SPEGLAR OCH GLAS</button>
    <button class="d" id="b-codex11">KORTARKIV: VERSION 11</button>
    <button class="d" id="b-pact13">DRAFT: RUNBOK OCH ÅNGKANON</button>
    <button class="d" id="b-draft13">DRAFT: BÖCKER, BLÄCK, ÅNGA OCH SMIDE</button>
    <button class="d" id="b-codex13">KORTARKIV: VERSION 13</button>
    <button class="d" id="b-pact15">DRAFT: RÖKELSEKAR OCH BIKASTARE</button>
    <button class="d" id="b-draft15">DRAFT: KATEDRAL, KLOCKOR, BIN OCH HONUNG</button>
    <button class="d" id="b-codex15">KORTARKIV: VERSION 15</button>
    <button class="d" id="b-pact16">DRAFT: TRÄDGÅRDSSAX OCH DRÖMSTAV</button>
    <button class="d" id="b-draft16">DRAFT: TRÄDGÅRD, TÖRNE, DRÖMMAR OCH SÖMN</button>
    <button class="d" id="b-codex16">KORTARKIV: VERSION 16</button>
  </div>
  <div id="log">Tangenter 1-9, pilar, Enter och Esc fungerar i fönstren. Spelkänslig tangent-test: tryck på tangenter medan ett fönster är öppet och se om de loggas nedan.</div>
</main>
<script src="../js/cards.js"></script>
<script src="../js/cardui.js"></script>
<script>
(() => {
  // Enkel seedad rng
  let s = 12345;
  const rng = { next() { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; },
    int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }, pick(a) { return a[Math.floor(this.next() * a.length)]; },
    weighted(a, fn) { let t = 0; for (const x of a) t += fn(x); let r = this.next() * t; for (const x of a) { r -= fn(x); if (r <= 0) return x; } return a[a.length - 1]; } };
  const q = new URLSearchParams(location.search);
  const state = { owned: ['slipstenen', 'slipstenen', 'kantvakten', 'glodkol', 'fyrklovern', 'offerdolken', 'askkungen', 'stenhjartat', 'lagerelden', 'prisma', 'halvmane', 'korsriddaren', 'offerkniven', 'grodan'], gold: 140, depth: 1, souls: 55 };
  // sedda kort (för NY-märket och kortarkivet): ägda plus några till
  const seen = new Set(state.owned.concat(['benflojt', 'manesilver', 'guldbaggen', 'ekot', 'vampyren', 'ouroboros', 'pakt_pistol', 'studskulan']));
  const unlocked = new Set(Cards.ALL.map(c => c.id)); // demo: allt upplåst
  const $ = id => document.getElementById(id);
  const log = t => { $('log').textContent = t + '\n' + $('log').textContent; };
  const stat = () => { $('state').textContent = 'GULD ' + state.gold + ' · KORT ' + state.owned.length + ' · DJUP ' + state.depth; };
  stat();
  // Tangenter som når sidan loggas, för att se att UI:t stoppar dem.
  addEventListener('keydown', e => log('tangent nådde sidan: ' + e.key));

  const draw = n => Cards.draw(rng, n, { owned: state.owned, depth: state.depth, luck: Cards.computeMods(state.owned).luck, unlocked });
  function draft(n) {
    CardUI.draft(draw(n), { title: 'VÄLJ ETT KORT', subtitle: 'FÖRSTA VÅNINGEN RENSAD. DÖDEN GER DIG EN GÅVA.', owned: state.owned }, c => {
      if (c) { state.owned.push(c.id); log('valde ' + c.name); } else log('hoppade över');
      stat();
    });
  }
  function shopItems() {
    const disc = Cards.computeMods(state.owned).shopDiscount;
    const items = draw(3).map(c => ({ kind: 'card', card: c, price: Cards.price(c, state.depth, disc) }));
    items.push({ kind: 'health', price: 30 }, { kind: 'armor', price: 25 }, { kind: 'ammo', price: 20 }, { kind: 'reroll', price: 15 });
    return items;
  }
  function shop() {
    CardUI.shop(shopItems(), state.gold, item => {
      if (item.price > state.gold) return { ok: false, gold: state.gold };
      state.gold -= item.price;
      if (item.kind === 'card') state.owned.push(item.card.id);
      log('köpte ' + (item.card ? item.card.name : item.kind));
      stat();
      return item.kind === 'reroll' ? { ok: true, gold: state.gold, items: shopItems() } : { ok: true, gold: state.gold };
    }, () => log('lämnade butiken'));
  }
  function souls() {
    const items = Cards.ALL.filter(c => c.unlock).slice(0, 8).map((c, i) => ({ kind: 'card', card: c, price: c.unlock, owned: i === 1 }));
    CardUI.shop(items, state.souls, item => { state.souls -= item.price; log('låste upp ' + item.card.name); return { ok: true, gold: state.souls }; }, null, { title: 'SJÄLSALTARET', currency: 'SJÄLAR', currencyColor: '#b8a0ff' });
  }
  $('b-draft').onclick = () => draft(3);
  $('b-draft5').onclick = () => draft(5);
  $('b-chest').onclick = () => { const c = draw(1)[0]; state.owned.push(c.id); stat(); CardUI.toast(c); };
  $('b-shop').onclick = shop;
  $('b-souls').onclick = souls;
  $('b-deck').onclick = () => CardUI.deck(state.owned);
  // draft med alla nya val: synergi- och NY-märken, förvisa (en gång) och nya kort för guld
  function draftX(cards) {
    cards = cards || draw(3);
    const shown = () => cards.forEach(c => seen.add(c.id));
    CardUI.draft(cards, {
      title: 'VÅNING 2 KLARAD', subtitle: 'VÄLJ ETT KORT', skipLabel: 'HOPPA ÖVER (+25 GULD)',
      owned: state.owned, seen: new Set(seen),
      banish: c => { const rep = Cards.draw(rng, 1, { owned: state.owned.concat(cards.map(x => x.id)), depth: state.depth, unlocked })[0] || null; if (rep) { cards = cards.map(x => x === c ? rep : x); log('förvisade ' + c.name + ' -> ' + rep.name); } return rep; },
      reroll: { price: 25, gold: state.gold, onReroll: () => { if (state.gold < 25) return null; state.gold -= 25; stat(); cards = draw(3); log('nya kort'); return cards; } },
    }, c => { shown(); if (c) { state.owned.push(c.id); log('valde ' + c.name); } else log('hoppade över'); stat(); });
  }
  $('b-draftx').onclick = () => draftX();
  $('b-codex').onclick = () => CardUI.codex(Cards.ALL, { seen, owned: new Set(state.owned), unlocked: new Set(Cards.ALL.filter(c => !c.unlock || c.unlock < 30).map(c => c.id)) }, () => log('stängde arkivet'));
  // version 5: statistik per kort, sammansmältning, "DU HAR" och legendarisk vändning
  const stats = {};
  for (const id of new Set(state.owned)) stats[id] = { dmg: (id.length * 977) % 9000, kills: id.length * 3, picks: 1 + (id.length % 3) };
  const counts = () => { const n = {}; for (const id of state.owned) n[id] = (n[id] || 0) + 1; return n; };
  function deck5() {
    CardUI.deck(state.owned, () => log('stängde kortleken'), {
      stats,
      onFuse: id => { // spelet byter två exemplar mot det sammansmälta kortet och lämnar tillbaka listan
        const fid = Cards.fuse(id);
        for (let k = 0; k < 2; k++) state.owned.splice(state.owned.indexOf(id), 1);
        state.owned.push(fid); stat(); log('smälte samman ' + id + ' -> ' + fid);
        stats[fid] = { dmg: 0, kills: 0, picks: 0 };
        return state.owned.slice();
      },
    });
  }
  const draft5x = () => CardUI.draft(['slipstenen', 'solkonungen', 'purpurkitteln'].map(Cards.byId), { title: 'VÄLJ ETT KORT', owned: state.owned, ownedCount: counts(), seen: new Set(seen) }, c => { if (c) { state.owned.push(c.id); log('valde ' + c.name); } stat(); });
  function alk() {
    const items = [{ kind: 'potion', price: 30, label: 'HELANDE DRYCK', text: '+40 HP' }, { kind: 'potion', price: 45, label: 'RASERIDRYCK', text: '+30 % SKADA I 20 S', color: '#ff6030' },
      { kind: 'blend', price: 60 }, { kind: 'map', price: 25 }, { kind: 'bless', price: 80 }, { kind: 'curse', price: 0, text: 'GRATIS, MEN DU FÅR ETT FÖRBANNAT KORT' }, { kind: 'weapon', price: 90, label: 'YXAN' }, { kind: 'pet', price: 120, label: 'SVART KATT' }];
    CardUI.shop(items, state.gold, item => { state.gold -= item.price; stat(); return { ok: true, gold: state.gold }; }, null, { title: 'ALKEMISTEN' });
  }
  $('b-deck5').onclick = deck5;
  $('b-draft5x').onclick = draft5x;
  $('b-alk').onclick = alk;
  // nya kort: före → efter i kortvalet (spelets M som opts.mods), förmågor, filter, förädling och saknade kort
  const draft6 = () => { // spelaren har två kort ur ASKANS ARV och förmågan BLINKEN
    const own = state.owned.concat(['eldrunan', 'brinnande_tornet', 'blinken']);
    CardUI.draft(['askbrevet', 'tidsbubblan', 'slipstenen', 'stjarnskytten'].map(Cards.byId), { title: 'VÄLJ ETT KORT', owned: own, ownedCount: counts(), seen: new Set(seen), mods: Cards.computeMods(own) }, c => { if (c) { state.owned.push(c.id); log('valde ' + c.name); } stat(); });
  };
  const deck6 = () => CardUI.deck(state.owned.concat(['blinken', 'askbrevet', 'jordskalvet', 'svarta_gavan', 'pakt_bage', 'solfjadern', 'runskivan']), () => log('stängde kortleken'), { stats, mods: Cards.computeMods(state.owned.concat(['askbrevet', 'svarta_gavan', 'runskivan', 'blinken', 'jordskalvet'])) });
  const refine6 = () => CardUI.refine(state.owned.concat(['blinken', 'runskivan', 'pakt_pistol', 'hamstraren']), (id, rid) => {
    const i = state.owned.indexOf(id); if (i >= 0) state.owned[i] = rid; else state.owned.push(rid); stat(); log('förädlade ' + id + ' -> ' + rid); CardUI.toast(Cards.byId(rid), 'FÖRÄDLAT KORT');
  }, () => log('avbröt förädlingen'));
  const codex6 = () => CardUI.codex(Cards.ALL.filter(c => !c.weapon), { seen: new Set(Cards.ALL.filter((c, i) => i % 3 === 0).map(c => c.id).concat(['blinken'])), owned: new Set(state.owned), unlocked: new Set(Cards.ALL.filter(c => !c.unlock || c.unlock < 25).map(c => c.id)) }, () => log('stängde arkivet'));
  $('b-draft6').onclick = draft6;
  $('b-deck6').onclick = deck6;
  $('b-refine').onclick = refine6;
  $('b-codex6').onclick = codex6;
  // version 7: glans på sällsynta och legendariska kort, försäljning, SENAST VALDA, sökning och set i kortarkivet
  const draft7 = () => CardUI.draft(['smygskorna', 'kastdolkarna', 'skuggkappan', 'morkrets_furste'].map(Cards.byId), { title: 'VÄLJ ETT KORT', owned: state.owned.concat(['tystlaten']), seen: new Set(seen), mods: Cards.computeMods(state.owned.concat(['tystlaten'])) }, c => { if (c) { state.owned.push(c.id); log('valde ' + c.name); } stat(); });
  const pact7 = () => CardUI.draft(['pakt_kniv', 'pakt_hammare', 'pakt_musköt'].map(Cards.byId), { title: 'SVÄR EN ED', owned: state.owned }, c => { if (c) { state.owned.push(c.id); log('svor ' + c.name); } stat(); });
  function shop7() {
    const items = ['guldsallet', 'gravplundraren', 'faraonens_mask', 'bankirens_sigill'].map(Cards.byId).map(c => ({ kind: 'card', card: c, price: Cards.price(c, state.depth, 0) }));
    items.push({ kind: 'health', price: 30 });
    CardUI.shop(items, state.gold + 400, item => ({ ok: true, gold: state.gold + 400 - item.price }), () => log('lämnade butiken'));
  }
  const deck7 = () => {
    const own = state.owned.concat(['pakt_kniv', 'knivsolfjadern', 'guldsallet', 'gyllene_skarabeen', 'skuldbrevet', 'faraonens_mask']);
    CardUI.deck(own, () => log('stängde kortleken'), {
      stats, depth: state.depth, mods: Cards.computeMods(own),
      onSell: id => { const p = Cards.sellPrice(id, state.depth); state.gold += p; const i = own.lastIndexOf(id); if (i >= 0) own.splice(i, 1); const k = state.owned.lastIndexOf(id); if (k >= 0) state.owned.splice(k, 1); stat(); log('sålde ' + id + ' för ' + p + ' guld'); return own.slice(); },
    });
  };
  const codex7 = () => CardUI.codex(Cards.ALL.filter(c => !c.weapon), { seen: new Set(Cards.ALL.filter((c, i) => i % 4 !== 0).map(c => c.id)), owned: new Set(state.owned), unlocked: new Set(Cards.ALL.filter(c => !c.unlock || c.unlock < 25).map(c => c.id)) }, () => log('stängde arkivet'));
  $('b-draft7').onclick = draft7;
  $('b-shop7').onclick = shop7;
  $('b-deck7').onclick = deck7;
  $('b-codex7').onclick = codex7;
  $('b-pact7').onclick = pact7;
  // version 8: talangval vid ny nivå, nya pakter, kort och set. Demoträd: 30 talanger, tio per gren (spelets riktiga träd finns i game.js).
  const T8 = [
    ['k_styrka', 'RÅSTYRKA', 'krigare', 3, null, '+8 % SKADA PER RANG'], ['k_harda', 'HÄRDAD', 'krigare', 3, null, '+15 MAX HP PER RANG'],
    ['k_slag', 'TUNGA SLAG', 'krigare', 2, 'k_styrka', '+20 % NÄRSTRIDSSKADA'], ['k_raseri', 'RASERI', 'krigare', 3, 'k_styrka', '+10 % SKADA UNDER 35 % HP'],
    ['k_mur', 'STENMUREN', 'krigare', 2, 'k_harda', '-8 % SKADA DU TAR'], ['k_blod', 'BLODTÖRST', 'krigare', 2, 'k_raseri', '+1 HP PER DÖDAD FIENDE'],
    ['k_skold', 'SKÖLDBÄRAREN', 'krigare', 1, 'k_mur', '+20 SKÖLD'], ['k_stot', 'CHOCKVÅGEN', 'krigare', 1, ['k_slag', 'k_mur'], 'LANDNINGAR SLÅR OMKULL'],
    ['k_jatte', 'JÄTTEDRÅPAREN', 'krigare', 2, 'k_slag', '+15 % SKADA MOT BOSSAR'], ['k_odod', 'OÖVERVINNLIG', 'krigare', 1, ['k_blod', 'k_skold'], 'EN GÅNG PER VÅNING: ÖVERLEV MED 1 HP'],
    ['s_smyg', 'SMYGARE', 'skugga', 3, null, '20 % MINDRE LJUD PER RANG'], ['s_krit', 'SKARPT ÖGA', 'skugga', 3, null, '+4 % KRITCHANS PER RANG'],
    ['s_dolk', 'RYGGHUGG', 'skugga', 2, 's_smyg', '+25 % SKADA BAKIFRÅN'], ['s_rus', 'SKUGGSTEG', 'skugga', 2, 's_smyg', '-20 % ÅTERHÄMTNING FÖR RUSNING'],
    ['s_gift', 'GIFTBLAD', 'skugga', 3, 's_krit', '+6 % CHANS ATT FÖRGIFTA'], ['s_undan', 'UNDANMANÖVER', 'skugga', 2, 's_rus', '+4 % CHANS ATT UNDVIKA'],
    ['s_mord', 'LÖNNMORD', 'skugga', 1, 's_dolk', 'OVETANDE FIENDER UNDER 30 % HP DÖR'], ['s_mork', 'MÖRKERSYN', 'skugga', 1, 's_smyg', 'FIENDER SYNS I MÖRKRET'],
    ['s_jakt', 'JÄGARINSTINKT', 'skugga', 2, 's_krit', '+30 % KRITSKADA'], ['s_dans', 'SKUGGDANS', 'skugga', 1, ['s_undan', 's_mord'], 'RUSNING GÖR DIG OSYNLIG I 2 S'],
    ['m_mana', 'MANAFLÖDE', 'mystiker', 3, null, '+15 % SNABBARE MANA'], ['m_insikt', 'INSIKT', 'mystiker', 3, null, '+10 % ERFARENHET PER RANG'],
    ['m_eld', 'ELDSJÄL', 'mystiker', 3, 'm_mana', '+6 % BRANDCHANS'], ['m_is', 'FROSTHAND', 'mystiker', 3, 'm_mana', '+6 % CHANS ATT FRYSA'],
    ['m_blixt', 'ÅSKKALLARE', 'mystiker', 2, 'm_eld', '+8 % BLIXTCHANS'], ['m_prisma', 'LJUSBRYTNING', 'mystiker', 2, 'm_insikt', '+1 DELNING I KRISTALLER'],
    ['m_hel', 'LÄKANDE LJUS', 'mystiker', 2, 'm_insikt', '+0,3 HP PER SEKUND'], ['m_runa', 'RUNVÄVARE', 'mystiker', 1, 'm_prisma', '+1 RUNPLATS'],
    ['m_tid', 'TIDSVÄVAREN', 'mystiker', 1, ['m_blixt', 'm_is'], '-25 % NEDRÄKNING FÖR FÖRMÅGAN'], ['m_arke', 'ÄRKEMAGIKERN', 'mystiker', 1, ['m_runa', 'm_hel'], '+20 % SKADA MED MAGI'],
  ].map(([id, name, branch, maxRank, req, text]) => ({ id, name, branch, maxRank, req, text }));
  const T8_BY = Object.fromEntries(T8.map(t => [t.id, t]));
  const t8 = { level: 6, owned: [{ id: 'k_styrka', rank: 2 }, { id: 'k_harda', rank: 3 }, { id: 's_smyg', rank: 1 }, { id: 'm_insikt', rank: 1 }, { id: 'k_raseri', rank: 1 }] };
  const t8rank = id => (t8.owned.find(o => o.id === id) || { rank: 0 }).rank;
  const t8open = () => T8.filter(t => t8rank(t.id) < t.maxRank && [].concat(t.req || []).every(r => t8rank(r) > 0));
  const t8opts = n => { const pool = t8open(), out = []; while (out.length < n && pool.length) out.push(pool.splice(Math.floor(rng.next() * pool.length), 1)[0]); return out.map(t => ({ ...t, rank: t8rank(t.id) + 1, icon: 'assets/gfx/talents/' + t.id + '.png' })); };
  let t8rr = 2;
  function talents8() {
    const first = ['k_slag', 's_dolk', 'm_prisma'].map(id => ({ ...T8_BY[id], rank: t8rank(id) + 1 }));
    CardUI.talents({ title: 'NY NIVÅ!', subtitle: 'VÄLJ EN TALANG', level: t8.level, options: first, owned: t8.owned, tree: T8, rerolls: t8rr,
      onReroll: () => { if (t8rr <= 0) return null; t8rr--; log('slog om talangerna'); return { options: t8opts(3), rerolls: t8rr }; } }, o => {
      const own = t8.owned.find(x => x.id === o.id); if (own) own.rank++; else t8.owned.push({ id: o.id, rank: 1 });
      t8.level++; log('valde talangen ' + o.name + ' (rang ' + t8rank(o.id) + ')');
    });
  }
  const pact8 = () => CardUI.draft(['pakt_harpun', 'pakt_bumerang', 'pakt_prisma'].map(Cards.byId), { title: 'SVÄR EN ED', owned: state.owned }, c => { if (c) { state.owned.push(c.id); log('svor ' + c.name); } stat(); });
  const draft8 = () => { // spelaren har två kort ur PRISMANS VÄG
    const own = state.owned.concat(['roda_skarvan', 'skarvlinsen']);
    CardUI.draft(['kristallbrytaren', 'krakens_vrede', 'siarens_oga', 'avgrundens_arkivarie'].map(Cards.byId), { title: 'VÄLJ ETT KORT', owned: own, seen: new Set(seen), mods: Cards.computeMods(own) }, c => { if (c) { state.owned.push(c.id); log('valde ' + c.name); } stat(); });
