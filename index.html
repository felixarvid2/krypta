<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Krypta</title>
<link rel="stylesheet" href="css/cards.css">
<style>
  @font-face { font-family: "PressStart2P"; src: url(assets/font/PressStart2P.ttf); }
  @font-face { font-family: "PressStart2P"; src: url(assets/font/KryptaRing.ttf); unicode-range: U+00C5, U+00E5; } /* Å och å med tydlig ring (fontens egen syns inte) */
  :root { --bg: #0b0806; --ink: #e8d9b0; --muted: #c9a87a; --dim: #8a7550; --blood: #d8442a; --btn: #5a1a10; --btn-hi: #7c2616; --edge: #d8a24a; --soul: #c0a0ff; color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: "PressStart2P", monospace; color: var(--ink); }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas { image-rendering: pixelated; width: min(100vw, 160vh); height: min(62.5vw, 100vh); background: #000; outline: none; cursor: crosshair; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: radial-gradient(rgba(42,24,16,0.82), rgba(11,8,6,0.78) 70%); text-align: center; padding: 16px; overflow-y: auto; }
  h1 { font-size: clamp(28px, 7vw, 64px); margin: 0; color: var(--blood); text-shadow: 4px 4px #000, 0 0 24px #6a1408; letter-spacing: 6px; }
  p { font-size: clamp(8px, 1.3vw, 11px); line-height: 2.1; margin: 0; color: var(--muted); max-width: 780px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  /* startskärmen: huvudvalen först, resten bakom fällbara paneler */
  #title { gap: 12px; justify-content: flex-start; }
  #title > h1 { margin-top: auto; } #title > #loadhelp { margin-bottom: auto; } /* centrerat när det får plats, rullbart utan att toppen klipps när det inte gör det */
  #title .mainrow button { min-width: 13em; }
  #title .panel { display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 12px 14px; border: 1px solid #3a2c1e; background: rgba(0,0,0,0.35); max-width: 860px; }
  #title .row.panel { flex-direction: row; }
  #title .panel .label { margin-top: 4px; }
  #title .seedbox { display: inline-flex; gap: 8px; align-items: center; }
  #setupsum { color: var(--muted); }
  #souls { margin-right: 4px; }
  #title .foot { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 4px; }
  #dailyinfo { line-height: 1.8; max-width: 760px; }
  button { font: inherit; font-size: 13px; padding: 13px 22px; background: var(--btn); color: #ffe9a8; border: 3px solid var(--edge); cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button:hover:not(:disabled), button:focus-visible { background: var(--btn-hi); outline: 2px solid #ffe9a8; outline-offset: 2px; }
  button.ghost { background: transparent; border-color: var(--dim); color: var(--muted); font-size: 10px; padding: 9px 14px; }
  #unlocks, #altar { border-color: var(--soul); color: var(--soul); }
  #diff button { font-size: 10px; padding: 9px 14px; background: transparent; border-color: var(--dim); color: var(--muted); }
  #ptitle { color: #ffd24a; letter-spacing: 2px; }
  @media (pointer: coarse) { .cu-li, .cu-btn, .cu-choices > * { min-height: 46px; } .cu-row { min-height: 44px; } .cu-row input[type=checkbox] { width: 26px; height: 26px; } .cu-row select { min-height: 38px; } }
  #classes button, #asc button, #pets button, #cmodes button, #slots button { font-size: 9px; padding: 8px 11px; background: transparent; border-color: var(--dim); color: var(--muted); }
  #classes button.locked, #pets button.locked { opacity: .55; }
  #classes button[aria-pressed="true"], #asc button[aria-pressed="true"], #pets button[aria-pressed="true"], #cmodes button[aria-pressed="true"], #slots button[aria-pressed="true"] { background: var(--btn); border-color: var(--edge); color: #ffe9a8; }
  #diff button[aria-pressed="true"] { background: var(--btn); border-color: var(--edge); color: #ffe9a8; }
  .label { font-size: 9px; color: var(--dim); letter-spacing: 1px; }
  input { font: inherit; font-size: 10px; padding: 9px 10px; width: 11em; background: #1b1410; color: var(--ink); border: 2px solid var(--dim); text-transform: uppercase; }
  input:focus-visible { outline: 2px solid #ffe9a8; }
  input[type=range] { width: 9em; padding: 0; border: 0; background: none; accent-color: var(--edge); }
  .sliders output { color: var(--ink); }
  #status, #best { font-size: 9px; color: var(--dim); line-height: 1.8; }
  #souls { font-size: 10px; color: var(--soul); }
  kbd { font-family: inherit; color: var(--ink); }
  /* mobilstyrning */
  #touch { position: fixed; inset: 0; z-index: 5; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    --b: calc(min(14vh, 9vw) * var(--bs, 1)); --m: calc((100vw - min(100vw, 160vh)) / 2); --g: 1.5vh;
    --rx: max(1vw, calc(var(--m) / 2 - var(--b) / 2)); --sx: max(1vw, calc(var(--m) / 2 - var(--b) * .35)); }
  #touch .tb { position: absolute; width: var(--b); height: var(--b); padding: 0; border: 0; background: none; opacity: var(--bo, .6); touch-action: none; }
  /* hopp, granat och rusning: vid bildens högra kant, ovanför listen och under minikartan */
  #touch .jumpb, #touch .grenb, #touch .dashb { width: calc(var(--b) * .85); height: calc(var(--b) * .85); right: calc(var(--m) + 1vw + env(safe-area-inset-right, 0px)); }
  #touch .jumpb { bottom: calc(min(62.5vw, 100vh) * .2 + 1vh); }
  #touch .grenb { bottom: calc(min(62.5vw, 100vh) * .2 + 1vh + var(--b) * .85 + var(--g)); }
  #touch .dashb { bottom: calc(min(62.5vw, 100vh) * .2 + 1vh + var(--b) * 1.7 + var(--g) * 2); }
  #touch .potb { width: calc(var(--b) * .85); height: calc(var(--b) * .85); right: calc(var(--m) + 1vw + env(safe-area-inset-right, 0px)); bottom: calc(min(62.5vw, 100vh) * .2 + 1vh + var(--b) * 2.55 + var(--g) * 3); }
  #touch .potb.empty { opacity: calc(var(--bo, .6) * .4); }
  #touch .abb { width: calc(var(--b) * .85); height: calc(var(--b) * .85); right: calc(var(--m) + 1vw + env(safe-area-inset-right, 0px)); bottom: calc(min(62.5vw, 100vh) * .2 + 1vh + var(--b) * 3.4 + var(--g) * 4); }
  #touch .abb.empty { opacity: calc(var(--bo, .6) * .4); }
  #touch .lampb { width: calc(var(--b) * .7); height: calc(var(--b) * .7); right: calc(var(--m) + 1vw + var(--b) * .95); bottom: calc(min(62.5vw, 100vh) * .2 + 1vh + var(--b) * 1.7 + var(--g) * 2); }
  #touch .stoneb { width: calc(var(--b) * .7); height: calc(var(--b) * .7); right: calc(var(--m) + 1vw + var(--b) * .95); bottom: calc(min(62.5vw, 100vh) * .2 + 1vh + var(--b) * 2.55 + var(--g) * 3); }
  #touch .crouchb { left: calc(var(--rx) + env(safe-area-inset-left, 0px)); bottom: calc(3vh + var(--b) + var(--g) + env(safe-area-inset-bottom, 0px)); }
  #cardui .cu-screen, #title { zoom: var(--ui-zoom, 1); }
  #touch .tb img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #touch .tb img.ic { inset: 22%; width: 56%; height: 56%; }
  #touch .tb.on, #touch .tb.lit { opacity: .95; filter: drop-shadow(0 0 6px #ffd24a); }
  /* höger kant: skjut längst ner, sedan sikta, ladda om, använd – i det svarta fältet bredvid bilden när det finns plats */
  #touch .fire { width: calc(var(--b) * 1.6); height: calc(var(--b) * 1.6); right: calc(max(1vw, var(--m) / 2 - var(--b) * .8) + env(safe-area-inset-right, 0px)); bottom: calc(3vh + env(safe-area-inset-bottom, 0px)); }
  #touch .aim { right: calc(var(--rx) + env(safe-area-inset-right, 0px)); bottom: calc(3vh + var(--b) * 1.6 + var(--g)); }
  #touch .reload { right: calc(var(--rx) + env(safe-area-inset-right, 0px)); bottom: calc(3vh + var(--b) * 2.6 + var(--g) * 2); }
  #touch .use { right: calc(var(--rx) + env(safe-area-inset-right, 0px)); bottom: calc(3vh + var(--b) * 3.6 + var(--g) * 3); }
  /* vänster kant: små knappar uppe, byt vapen nere */
  #touch .small { width: calc(var(--b) * .7); height: calc(var(--b) * .7); left: calc(var(--sx) + env(safe-area-inset-left, 0px)); }
  #touch .pausebtn { top: calc(2vh + env(safe-area-inset-top, 0px)); }
  #touch .deck { top: calc(2vh + var(--b) * .8 + env(safe-area-inset-top, 0px)); }
  #touch .map { top: calc(2vh + var(--b) * 1.6 + env(safe-area-inset-top, 0px)); }
  #touch .fsbtn { top: calc(2vh + var(--b) * 2.4 + env(safe-area-inset-top, 0px)); }
  #touch .gearbtn { top: calc(2vh + var(--b) * 3.2 + env(safe-area-inset-top, 0px)); }
  #touch .giveupbtn { top: calc(2vh + var(--b) * 4 + env(safe-area-inset-top, 0px)); }
  #touch:not(.playing) .tb.fsbtn { display: block; } /* helskärm går att nå även i pausen */
  #touch.paused .tb.gearbtn, #touch.paused .tb.giveupbtn { display: block; } /* inställningar och ge upp i pausen */
  #touch.playing .tb.gearbtn, #touch.playing .tb.giveupbtn { display: none; }
  #touch.lefty { transform: scaleX(-1); } /* vänsterhänt: spegelvänd layout */
  .fsonly { display: none; }
  body.touch .fsonly { display: inline-block; }
  #touch .swap { left: calc(var(--rx) + env(safe-area-inset-left, 0px)); bottom: calc(3vh + env(safe-area-inset-bottom, 0px)); }
  #touch:not(.playing) .tb { display: none; }
  #touch .joy { position: absolute; width: 26vmin; height: 26vmin; transform: translate(-50%, -50%); pointer-events: none; opacity: .6; }
  #touch .joy img { position: absolute; }
  #touch .joy .pad { inset: 0; width: 100%; height: 100%; }
  #touch .joy .nub { left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); }
  /* stående: bilden överst, små knappar under den, joysticken till vänster och eldknapparna nere till höger */
  @media (orientation: portrait) {
    #wrap { align-items: flex-start; padding-top: env(safe-area-inset-top, 0px); }
    #touch { --b: calc(min(17vw, 10vh) * var(--bs, 1)); --cb: calc(env(safe-area-inset-top, 0px) + 62.5vw); --p: 4vw; --bot: calc(5vh + env(safe-area-inset-bottom, 0px)); }
    /* bilden upp till 25 % större med beskurna kanter (HUD:en flyttas in, hudIX i game.js), men aldrig ned till de övre knapparna (--bs sätts även på :root). ALLA KNAPPAR: som förr */
    body.touch:not(:has(#touch.all)) { --ch: clamp(62.5vw, calc(95vh - 9vw - 10px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 4.4 * min(17vw, 10vh) * var(--bs, 1)), 78.125vw); }
    body.touch:not(:has(#touch.all)) canvas { width: calc(var(--ch) * 1.6); height: var(--ch); flex: none; }
    body.touch:not(:has(#touch.all)) #touch { --cb: calc(env(safe-area-inset-top, 0px) + var(--ch)); }
    #touch .fire { right: var(--p); bottom: var(--bot); }
    #touch .aim { right: calc(var(--p) + var(--b) * 1.6 + 3vw); bottom: var(--bot); }
    #touch .reload { right: calc(var(--p) + var(--b) * .3); bottom: calc(var(--bot) + var(--b) * 1.6 + 3vw); }
    #touch .use { right: calc(var(--p) + var(--b) * 1.6 + 3vw); bottom: calc(var(--bot) + var(--b) + 3vw); }
    #touch .swap { left: var(--p); bottom: auto; top: calc(var(--cb) + 3vw); }
    #touch .small { left: auto; top: calc(var(--cb) + 3vw + var(--b) * .15); }
    #touch .pausebtn { right: var(--p); }
    #touch .fsbtn { right: calc(var(--p) + var(--b) * .7 + 3vw); }
    #touch .map { right: calc(var(--p) + var(--b) * 1.4 + 6vw); }
    #touch .deck { right: calc(var(--p) + var(--b) * 2.1 + 9vw); }
    #touch .gearbtn { right: calc(var(--p) + var(--b) * 1.4 + 6vw); }
    #touch .giveupbtn { right: calc(var(--p) + var(--b) * 2.1 + 9vw); }
    #touch .joy { width: 34vw; height: 34vw; }
    #touch .jumpb, #touch .grenb, #touch .dashb { width: var(--b); height: var(--b); }
    #touch .jumpb { right: var(--p); bottom: calc(var(--bot) + var(--b) * 1.6 + 3vw + var(--b) + 3vw); }
    #touch .grenb { right: calc(var(--p) + var(--b) + 3vw); bottom: calc(var(--bot) + var(--b) * 1.6 + 3vw + var(--b) + 3vw); }
    #touch .dashb { right: calc(var(--p) + var(--b) * 2 + 6vw); bottom: calc(var(--bot) + var(--b) * 1.6 + 3vw + var(--b) + 3vw); }
    #touch .lampb { width: calc(var(--b) * .8); height: calc(var(--b) * .8); right: calc(var(--p) + var(--b) * 5 + 15vw); bottom: calc(var(--bot) + var(--b) * 1.6 + 3vw + var(--b) + 3vw); }
    #touch .stoneb { width: calc(var(--b) * .8); height: calc(var(--b) * .8); left: var(--p); bottom: auto; top: calc(var(--cb) + 3vw + var(--b) * 2 + 6vw); }
    #touch .abb { width: var(--b); height: var(--b); right: calc(var(--p) + var(--b) * 4 + 12vw); bottom: calc(var(--bot) + var(--b) * 1.6 + 3vw + var(--b) + 3vw); }
    #touch .potb { width: var(--b); height: var(--b); right: calc(var(--p) + var(--b) * 3 + 9vw); bottom: calc(var(--bot) + var(--b) * 1.6 + 3vw + var(--b) + 3vw); }
    #touch .crouchb { left: var(--p); bottom: auto; top: calc(var(--cb) + 3vw + var(--b) + 3vw); }
  }
  #loadwrap { width: min(320px, 80vw); height: 6px; margin: 6px auto; background: #2a1e14; border: 1px solid #5a4630; }
  #loadbar { height: 100%; width: 0; background: #c9a87a; transition: width .1s; }
  #version { color: #9fd0ff; }
  #touch .walkb { display: none; }
  #touch.onehand .walkb { display: block; width: calc(var(--b) * .85); height: calc(var(--b) * .85); right: calc(var(--m) + 1vw + var(--b) * .95); bottom: calc(min(62.5vw, 100vh) * .2 + 1vh); }
  #touch.onehand .crouchb { left: auto; right: calc(var(--m) + 1vw + var(--b) * .95); bottom: calc(min(62.5vw, 100vh) * .2 + 1vh + var(--b) * .85 + var(--g)); top: auto; }
  #touch .tb.lit { opacity: 1; filter: drop-shadow(0 0 6px #ffd24a); }
  #touch.layout .tb { opacity: 1; outline: 2px dashed #ffd24a; display: block; }
  /* UI-omgörningen: få knappar (#touch:not(.all)). Inställningen ALLA KNAPPAR (.all) ger exakt de gamla reglerna ovan.
     Permanent: AVFYRA, ALT, HOPPA, RUSA, PAUS. .ctx syns bara när de går att använda (.show), .xtra nås via pausen/HUD-hörnen. */
  #touch:not(.all) { --vr: max(calc(var(--m) + 1vw), calc(max(1vw, var(--m) / 2 - var(--b) * .875) + var(--b) * 1.75 + var(--g))); } /* bildens högra kant, men aldrig över AVFYRA */
  #touch:not(.all) .tb.xtra { display: none !important; }
  #touch:not(.all).playing:not(.layout) .tb.fsbtn { display: none; }
  #touch:not(.all):not(.layout) .tb.ctx:not(.show) { display: none; }
  #touch:not(.all) .tb.ctx.show { animation: tbpop .18s ease-out; }
  @keyframes tbpop { from { transform: scale(.3); opacity: 0; } }
  #touch:not(.all) .fire { width: calc(var(--b) * 1.75); height: calc(var(--b) * 1.75); right: calc(max(1vw, var(--m) / 2 - var(--b) * .875) + env(safe-area-inset-right, 0px)); bottom: calc(3vh + env(safe-area-inset-bottom, 0px)); opacity: min(1, calc(var(--bo, .6) + .25)); }
  #touch:not(.all) .aim { bottom: calc(3vh + var(--b) * 1.75 + var(--g)); }
  #touch:not(.all) .reload, #touch:not(.all) .use { width: calc(var(--b) * .85); height: calc(var(--b) * .85); }
  #touch:not(.all) .reload { bottom: calc(3vh + var(--b) * 2.75 + var(--g) * 2); }
  #touch:not(.all) .use { bottom: calc(3vh + var(--b) * 3.6 + var(--g) * 3); }
  #touch:not(.all) .jumpb, #touch:not(.all) .dashb, #touch:not(.all) .grenb, #touch:not(.all) .potb, #touch:not(.all) .abb, #touch:not(.all) .lampb { width: calc(var(--b) * .85); height: calc(var(--b) * .85); right: calc(var(--vr) + env(safe-area-inset-right, 0px)); }
  #touch:not(.all) .jumpb { bottom: calc(3vh + env(safe-area-inset-bottom, 0px)); }
  #touch:not(.all) .dashb { bottom: calc(3vh + var(--b) * .85 + var(--g)); }
  #touch:not(.all) .grenb { bottom: calc(3vh + var(--b) * 1.7 + var(--g) * 2); }
  #touch:not(.all) .potb { bottom: calc(3vh + var(--b) * 1.7 + var(--g) * 2); } /* högst tre rader: minikartan ligger ovanför */
  @media (orientation: landscape) and (max-aspect-ratio: 19/10) { /* smala svarta fält (16:9): ANVÄND och LADDA OM flyttar in i bilden, annars hamnar de på minikartan */
    #touch:not(.all) .use, #touch:not(.all) .reload { right: calc(var(--vr) + var(--b) * 1.7 + var(--g) * 2 + env(safe-area-inset-right, 0px)); }
    #touch:not(.all) .use { bottom: calc(3vh + env(safe-area-inset-bottom, 0px)); }
    #touch:not(.all) .reload { bottom: calc(3vh + var(--b) * .85 + var(--g)); }
    #touch:not(.all).onehand .tb.walkb { right: calc(var(--vr) + var(--b) * 2.55 + var(--g) * 3 + env(safe-area-inset-right, 0px)); }
    #touch:not(.all) .tb.pausebtn { top: calc(16vh + env(safe-area-inset-top, 0px)); left: 1vw; } /* under hälsan, som här når ut i det smala fältet */
  }
  #touch:not(.all) .abb, #touch:not(.all) .lampb, #touch:not(.all) .potb { right: calc(var(--vr) + var(--b) * .85 + var(--g) + env(safe-area-inset-right, 0px)); }
  #touch:not(.all) .abb { bottom: calc(3vh + env(safe-area-inset-bottom, 0px)); }
  #touch:not(.all) .lampb { bottom: calc(3vh + var(--b) * .85 + var(--g)); }
  #touch:not(.all) .potb.empty, #touch:not(.all) .abb.empty { opacity: var(--bo, .6); }
  #touch:not(.all).onehand .walkb { right: calc(var(--vr) + var(--b) * 1.7 + var(--g) * 2 + env(safe-area-inset-right, 0px)); bottom: calc(3vh + env(safe-area-inset-bottom, 0px)); }
  #touch .rothint { display: none; position: absolute; left: 50%; width: 9vw; height: 9vw; transform: translateX(-50%); pointer-events: none; opacity: .45; }
  #touch .rothint img { width: 100%; height: 100%; }
  @media (orientation: portrait) {
    #touch:not(.all) .fire { width: calc(var(--b) * 1.7); height: calc(var(--b) * 1.7); right: var(--p); bottom: var(--bot); }
    #touch:not(.all) .aim { right: calc(var(--p) + var(--b) * 1.7 + 3vw); bottom: var(--bot); }
    #touch:not(.all) .jumpb, #touch:not(.all) .dashb { width: var(--b); height: var(--b); }
    #touch:not(.all) .jumpb { right: calc(var(--p) + var(--b) * .35); bottom: calc(var(--bot) + var(--b) * 1.7 + 3vw); }
    #touch:not(.all) .dashb { right: calc(var(--p) + var(--b) * 1.7 + 3vw); bottom: calc(var(--bot) + var(--b) + 3vw); }
    #touch:not(.all) .pausebtn { left: var(--p); right: auto; top: calc(var(--cb) + 3vw); }
    #touch:not(.all) .use, #touch:not(.all) .reload, #touch:not(.all) .grenb, #touch:not(.all) .potb, #touch:not(.all) .abb, #touch:not(.all) .lampb { width: calc(var(--b) * .85); height: calc(var(--b) * .85); }
    #touch:not(.all) .use, #touch:not(.all) .reload, #touch:not(.all) .grenb { bottom: calc(var(--bot) + var(--b) * 2.7 + 6vw); }
    #touch:not(.all) .potb, #touch:not(.all) .abb, #touch:not(.all) .lampb { bottom: calc(var(--bot) + var(--b) * 3.55 + 9vw); }
    #touch:not(.all) .use, #touch:not(.all) .potb { right: var(--p); }
    #touch:not(.all) .reload, #touch:not(.all) .abb { right: calc(var(--p) + var(--b) * .85 + 3vw); }
    #touch:not(.all) .grenb, #touch:not(.all) .lampb { right: calc(var(--p) + var(--b) * 1.7 + 6vw); }
    #touch:not(.all).onehand .walkb { width: calc(var(--b) * .85); height: calc(var(--b) * .85); right: calc(var(--p) + var(--b) * 2.55 + 9vw); bottom: calc(var(--bot) + var(--b) * 2.7 + 6vw); }
    #touch.playing .rothint.on { display: block; top: calc(var(--cb) + 3vw); animation: tbpop .3s ease-out; } /* "vrid för helskärm", en gång */
  }
  .layoutbar { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 60; display: flex; gap: 8px; align-items: center; background: #000c; padding: 8px; font: 10px "PressStart2P", monospace; color: #ffe9a8; }
